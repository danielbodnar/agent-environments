# syntax=docker/sandbox-kit:3
# Docker Sandboxes workload kit (Kit spec v3) that runs Claude Code on the
# agent-environments image. Modeled on the spec's examples/claude kit.
#
#   sbx run ./sandboxes/sbx/agent-env .
schemaVersion: "3"
displayName: Claude Code (agent-environments)
description: >-
  Claude Code on the agent-environments image: Bun, mise tools, the
  1Password CLI, Cloudflare CLIs, and the curated plugin set.
sourceUrl: https://github.com/danielbodnar/agent-environments
licenses: [MIT]

kind: workload
version: "0.1.0"

args:
  image:
    default: ghcr.io/danielbodnar/agent-environments:latest
    description: agent-environments image to run
    buildArg: IMAGE

provides: ["claude"]

capabilities:
  - type: com.docker.sandbox/sbx@1

  - type: com.docker.sandbox/network-policy@1
    config:
      runtime:
        allow:
          - api.anthropic.com:443
          - platform.claude.com:443
          - downloads.claude.ai:443
          - claude.com:443
          - mcp-proxy.anthropic.com:443
          - bridge.claudeusercontent.com:443
          - github.com:443
          - api.github.com:443
          - codeload.github.com:443
          - registry.npmjs.org:443
          - registry.vlt.io:443
          - api.socket.dev:443
          - api.osv.dev:443
          - api.cloudflare.com:443
          - my.1password.com:443

  - type: com.docker.sandbox/credential@1
    name: Anthropic access
    optional: true
    description: Anthropic API access (API key or claude.ai OAuth)
    config:
      service: anthropic
      phase: runtime
      apiKey:
        name: ANTHROPIC_API_KEY
        inject:
          - {domain: api.anthropic.com, header: x-api-key, format: "%s"}
          - {domain: mcp-proxy.anthropic.com, header: x-api-key, format: "%s"}
      oauth:
        tokenEndpoint: {host: platform.claude.com, path: /v1/oauth/token}
        sentinels:
          accessToken: sk-ant-oat01-proxy-managed
          refreshToken: sk-ant-ort01-proxy-managed
        credentialFile:
          path: ~/.claude/.credentials.json
          structure:
            claudeAiOauth:
              accessToken: "{{.AccessToken}}"
              refreshToken: "{{.RefreshToken}}"
              expiresAt: "{{.ExpiresAt}}"
              scopes: "{{.Scopes}}"
            primaryApiKey: "{{.PrimaryApiKey}}"
