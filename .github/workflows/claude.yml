name: claude

# Claude Code answers issue and PR comments that mention @claude, as a
# read-only reviewer.
#
# Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN   from `claude setup-token`
#
# On a PR the checkout is the PR's code, which can come from a fork, and
# the issue or PR text can carry a prompt injection even when a trusted
# collaborator wrote the comment. So nothing from the checkout runs:
#   - no setup step and no settings file from the repo; settings are inline
#   - --setting-sources user and --strict-mcp-config, so a PR's
#     .claude/settings.json hooks and .mcp.json servers are ignored
#   - no plugins (plugins can carry hooks and MCP servers)
#   - tools limited to Read, Glob, Grep: no shell, so no way to print the
#     OAuth token from the environment or run git
#   - contents: read, so nothing can be pushed; write access only to post
#     the reply
#   - no 1Password token
# id-token: write lets the action mint its own GitHub App token.
#
# For agent work that needs the toolchain, run on trusted input only, for
# example workflow_dispatch on a branch, with
# .github/actions/setup-agent-env.

on:
  # zizmor: ignore[dangerous-triggers] -- only owners, members, and collaborators trigger it, and nothing from the checkout executes.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          settings: '{"attribution": {"commit": "", "pr": ""}}'
          claude_args: --allowedTools Read,Glob,Grep --setting-sources user --strict-mcp-config
