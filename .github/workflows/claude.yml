name: claude

# Claude Code on issue and PR comments that mention @claude, running on
# the agent-environments toolchain with the curated plugins.
#
# Secrets:
#   CLAUDE_CODE_OAUTH_TOKEN   from `claude setup-token`
#
# The agent here acts on comment text, so it gets no 1Password token: a
# prompt-injected comment could otherwise make it print or send secrets.
# Resolve any secret a job needs in its own step, scoped to one command.

on:
  # zizmor: ignore[dangerous-triggers] -- the job runs only for comments from owners, members, and collaborators.
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

permissions:
  contents: read

jobs:
  claude:
    if: contains(github.event.comment.body, '@claude') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-agent-env
        id: agent-env
      - uses: anthropics/claude-code-action@6d5ae526d25ce88daa2200be073e1a373167f064 # v1.0.265
        env:
          AGENT_ENV_HOME: ${{ steps.agent-env.outputs.home }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          plugin_marketplaces: |
            https://github.com/anthropics/claude-plugins-official.git
            https://github.com/cloudflare/skills.git
          plugins: |
            superpowers@claude-plugins-official
            pr-review-toolkit@claude-plugins-official
            code-review@claude-plugins-official
            commit-commands@claude-plugins-official
            security-guidance@claude-plugins-official
            cloudflare@cloudflare
          settings: claude/settings.json
