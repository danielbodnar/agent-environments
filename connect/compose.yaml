# 1Password Connect server: the official two-container layout.
#
# Put the server's 1password-credentials.json next to this file (it's
# gitignored), then: docker compose -f connect/compose.yaml up -d
# The API listens on :8080. Agents reach it through OP_CONNECT_HOST and
# OP_CONNECT_TOKEN, so it must be reachable from wherever they run.
services:
  op-connect-api:
    image: docker.io/1password/connect-api:latest
    ports:
      - "8080:8080"
    volumes:
      - "./1password-credentials.json:/home/opuser/.op/1password-credentials.json:ro"
      - "data:/home/opuser/.op/data"
    restart: unless-stopped
  op-connect-sync:
    image: docker.io/1password/connect-sync:latest
    ports:
      - "8081:8080"
    volumes:
      - "./1password-credentials.json:/home/opuser/.op/1password-credentials.json:ro"
      - "data:/home/opuser/.op/data"
    restart: unless-stopped
volumes:
  data:
